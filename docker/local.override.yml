services:
  uwsgi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        WATCHMAN: "true"
    image: honeybadgerproject/honeybadger:test
    volumes:
      - ../:/opt/deploy/honeybadger
    environment:
      - DEBUG=True
      - DJANGO_TEST_SERVER=True
      - DJANGO_WATCHMAN_TIMEOUT=20

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile_nginx
    image: honeybadgerproject/honeybadger_nginx:test
    volumes:
      - ../configuration/nginx/django_server.conf:/etc/nginx/conf.d/default.conf

  celery_beat:
    image: honeybadgerproject/honeybadger:test
    volumes:
      - ../:/opt/deploy/honeybadger

  celery_worker_default:
    image: honeybadgerproject/honeybadger:test
    volumes:
      - ../:/opt/deploy/honeybadger