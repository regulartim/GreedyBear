# you have to populate the ENV variable REACT_APP_HONEYBADGER_VERSION in the .env file to have this work
services:
  uwsgi:
    image: honeybadgerproject/honeybadger:${REACT_APP_HONEYBADGER_VERSION}

  nginx:
    image: honeybadgerproject/honeybadger_nginx:${REACT_APP_HONEYBADGER_VERSION}

  celery_beat:
    image: honeybadgerproject/honeybadger:${REACT_APP_HONEYBADGER_VERSION}

  celery_worker_default:
    image: honeybadgerproject/honeybadger:${REACT_APP_HONEYBADGER_VERSION}